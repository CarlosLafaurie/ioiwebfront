name: Deploy Frontend to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Deploy dist to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 88.223.85.12
          username: u995196264
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: 65002
          source: "dist/*"
          target: "/home/u995196264/domains/ioidev.solutions/public_html"
          strip_components: 1
          rm: true